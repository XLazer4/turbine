<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f3f46"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .t { fill: #18181b; }
      .m { fill: #52525b; }
      .b { font-weight: 700; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .s11 { font-size: 11px; }
      .s12 { font-size: 12px; }
      .s13 { font-size: 13px; }
      .s14 { font-size: 14px; }
      .s15 { font-size: 15px; }
    </style>
  </defs>

  <rect width="1280" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="44" class="t b" font-size="24">Pre-req Vault: architecture</text>
  <text x="40" y="68" class="m s13">Anchor 1.1.2 on devnet · Vault program <tspan class="mono">7avrR98rfWTq264gvCxfjKHc5prpVV2maGJ6zVJj8n1o</tspan></text>

  <!-- ============ Panel 1: programs and accounts ============ -->
  <text x="40" y="112" class="t b s15">1 · Programs and accounts</text>

  <!-- User -->
  <rect x="40" y="250" width="170" height="100" rx="10" fill="#f4f4f5" stroke="#52525b" stroke-width="1.5"/>
  <text x="56" y="276" class="t b s15">User wallet</text>
  <text x="56" y="297" class="m s12">signs every instruction</text>
  <text x="56" y="315" class="m s12">pays fees and rent</text>
  <text x="56" y="335" class="m s12 mono">gz8k…pvQ5N</text>

  <line x1="210" y1="300" x2="258" y2="300" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="234" y="292" class="m s11" text-anchor="middle">tx</text>

  <!-- Vault program -->
  <rect x="260" y="140" width="340" height="330" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="276" y="166" class="t b s15">Vault program</text>
  <text x="276" y="186" class="m s12">stateless code; all state lives in accounts</text>

  <rect x="276" y="204" width="308" height="56" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="290" y="227" class="t b s14 mono">initialize()</text>
  <text x="290" y="247" class="m s12">create vault_state, store both bumps</text>

  <rect x="276" y="270" width="308" height="56" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="290" y="293" class="t b s14 mono">deposit(amount)</text>
  <text x="290" y="313" class="m s12">System transfer: user → vault</text>

  <rect x="276" y="336" width="308" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="290" y="359" class="t b s14 mono">withdraw(amount)</text>
  <text x="570" y="359" class="s11 b" fill="#b45309" text-anchor="end">EXTENDED</text>
  <text x="290" y="379" class="m s12">vault → user, then CPI to register GitHub</text>

  <rect x="276" y="402" width="308" height="56" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="290" y="425" class="t b s14 mono">close()</text>
  <text x="290" y="445" class="m s12">drain vault → user, close vault_state</text>

  <!-- Vault program -> vault_state -->
  <line x1="600" y1="188" x2="718" y2="188" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="180" class="m s11" text-anchor="middle">init · read · close</text>

  <!-- Vault program -> System Program -->
  <line x1="600" y1="430" x2="718" y2="430" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="422" class="m s11" text-anchor="middle">transfer CPI</text>
  <text x="660" y="447" class="m s11" text-anchor="middle">vault signs w/ seeds</text>

  <!-- vault_state -->
  <rect x="720" y="140" width="240" height="96" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="736" y="164" class="t b s14 mono">vault_state</text>
  <text x="944" y="164" class="s11 b" fill="#2563eb" text-anchor="end">PDA</text>
  <text x="736" y="184" class="t s12 mono">seeds ["state", user]</text>
  <text x="736" y="203" class="m s12">owner: Vault program</text>
  <text x="736" y="222" class="m s12">data: vault_bump, state_bump</text>

  <!-- vault -->
  <rect x="720" y="256" width="240" height="96" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="736" y="280" class="t b s14 mono">vault</text>
  <text x="944" y="280" class="s11 b" fill="#2563eb" text-anchor="end">PDA</text>
  <text x="736" y="300" class="t s12 mono">seeds ["vault", vault_state]</text>
  <text x="736" y="319" class="m s12">owner: System Program</text>
  <text x="736" y="338" class="m s12">holds the SOL, no data</text>

  <!-- System Program -->
  <rect x="720" y="392" width="240" height="78" rx="10" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <text x="736" y="416" class="t b s14">System Program</text>
  <text x="736" y="436" class="m s12 mono">1111…1111</text>
  <text x="736" y="455" class="m s12">moves lamports, creates accounts</text>

  <line x1="840" y1="392" x2="840" y2="355" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="848" y="378" class="m s11">moves SOL</text>

  <!-- CPI route: Vault program -> Registration program -->
  <path d="M430,140 V122 H1130 V138" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="780" y="114" class="s12 b" fill="#6d28d9" text-anchor="middle">withdraw: CPI registration.initialize("XLazer4"), user's signature carries through</text>

  <!-- Registration program -->
  <rect x="1020" y="140" width="220" height="110" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1036" y="164" class="t b s14">Registration program</text>
  <text x="1036" y="184" class="m s12 mono">TRBZy…KWDM</text>
  <text x="1036" y="204" class="t s12 mono">initialize(github)</text>
  <text x="1036" y="224" class="m s11">from its IDL via declare_program!</text>
  <text x="1036" y="240" class="m s11">(we call it, we don't own it)</text>

  <line x1="1130" y1="250" x2="1130" y2="298" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="1138" y="279" class="s11" fill="#6d28d9">creates</text>

  <!-- application_account -->
  <rect x="1020" y="300" width="220" height="170" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1036" y="324" class="t b s13 mono">application_account</text>
  <text x="1224" y="324" class="s11 b" fill="#7c3aed" text-anchor="end">PDA</text>
  <text x="1036" y="344" class="t s12 mono">seeds ["prereqs", user]</text>
  <text x="1036" y="362" class="m s11">derived from Registration program</text>
  <text x="1036" y="381" class="m s12">owner: Registration program</text>
  <text x="1036" y="402" class="m s12 mono">user, bump,</text>
  <text x="1036" y="420" class="m s12 mono">pre_req_ts, pre_req_rs,</text>
  <text x="1036" y="440" class="t s12 mono b">github = "XLazer4"</text>
  <text x="1036" y="459" class="m s11">one per wallet</text>

  <!-- Legend -->
  <rect x="40" y="494" width="22" height="14" rx="3" fill="#ffffff" stroke="#3f3f46" stroke-dasharray="4 3"/>
  <text x="70" y="506" class="m s12">dashed = PDA: no private key, the owning program "signs" with seeds + bump</text>
  <rect x="560" y="494" width="14" height="14" rx="3" fill="#eff6ff" stroke="#2563eb"/>
  <text x="582" y="506" class="m s12">Vault program</text>
  <rect x="686" y="494" width="14" height="14" rx="3" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="708" y="506" class="m s12">Registration program (given IDL)</text>
  <rect x="918" y="494" width="14" height="14" rx="3" fill="#fef3c7" stroke="#d97706"/>
  <text x="940" y="506" class="m s12">the part I added</text>

  <!-- ============ Panel 2: lifecycle ============ -->
  <text x="40" y="556" class="t b s15">2 · Lifecycle: how state changes, one instruction at a time</text>

  <!-- header row -->
  <rect x="40" y="570" width="1200" height="44" fill="#fafafa" stroke="#e4e4e7"/>
  <rect x="230" y="570" width="252" height="44" fill="#eff6ff" stroke="#e4e4e7"/>
  <rect x="482" y="570" width="252" height="44" fill="#eff6ff" stroke="#e4e4e7"/>
  <rect x="734" y="570" width="252" height="44" fill="#fef3c7" stroke="#e4e4e7"/>
  <rect x="986" y="570" width="254" height="44" fill="#eff6ff" stroke="#e4e4e7"/>
  <text x="56" y="597" class="m s12 b">STEP</text>
  <text x="246" y="597" class="t b s14 mono">1 · initialize()</text>
  <text x="498" y="597" class="t b s14 mono">2 · deposit(1 SOL)</text>
  <text x="750" y="597" class="t b s14 mono">3 · withdraw(0.5 SOL)</text>
  <text x="1002" y="597" class="t b s14 mono">4 · close()</text>

  <!-- row grid -->
  <g fill="none" stroke="#e4e4e7">
    <rect x="40" y="614" width="1200" height="56"/>
    <rect x="40" y="670" width="1200" height="40"/>
    <rect x="40" y="710" width="1200" height="40"/>
    <rect x="40" y="750" width="1200" height="56"/>
    <rect x="40" y="806" width="1200" height="56"/>
    <line x1="230" y1="614" x2="230" y2="862"/>
    <line x1="482" y1="614" x2="482" y2="862"/>
    <line x1="734" y1="614" x2="734" y2="862"/>
    <line x1="986" y1="614" x2="986" y2="862"/>
  </g>
  <rect x="734.5" y="614.5" width="251" height="247" fill="#fffbeb" opacity="0.6"/>

  <!-- row labels -->
  <text x="56" y="646" class="t b s13">What happens</text>
  <text x="56" y="695" class="t b s13 mono">vault_state</text>
  <text x="56" y="735" class="t b s13 mono">vault balance</text>
  <text x="56" y="782" class="t b s13 mono">application_account</text>
  <text x="56" y="838" class="t b s13">Signers</text>

  <!-- What happens -->
  <text x="246" y="636" class="t s12">Creates vault_state, saves bumps.</text>
  <text x="246" y="655" class="m s12">vault address is only derived.</text>
  <text x="498" y="636" class="t s12">System transfer user → vault.</text>
  <text x="498" y="655" class="m s12">Plain CPI, no PDA signature.</text>
  <text x="750" y="636" class="t s12">System transfer vault → user,</text>
  <text x="750" y="655" class="t s12">then CPI into Registration.</text>
  <text x="1002" y="636" class="t s12">Sends all vault SOL to user,</text>
  <text x="1002" y="655" class="m s12">closes vault_state, rent back.</text>

  <!-- vault_state -->
  <text x="246" y="695" class="t s12">created (user pays rent)</text>
  <text x="498" y="695" class="m s12">read: seeds + bump checked</text>
  <text x="750" y="695" class="m s12">read: seeds + bump checked</text>
  <text x="1002" y="695" class="t s12">closed</text>

  <!-- vault balance -->
  <text x="246" y="735" class="t s12 mono">0 SOL</text>
  <text x="498" y="735" class="t s12 mono">1 SOL</text>
  <text x="750" y="735" class="t s12 mono">0.5 SOL</text>
  <text x="1002" y="735" class="t s12 mono">0 SOL</text>

  <!-- application_account -->
  <text x="246" y="782" class="m s12">does not exist</text>
  <text x="498" y="782" class="m s12">does not exist</text>
  <text x="750" y="772" class="t s12 b">created by Registration</text>
  <text x="750" y="791" class="t s12 mono">github = "XLazer4"</text>
  <text x="1002" y="772" class="m s12">unchanged: owned by</text>
  <text x="1002" y="791" class="m s12">Registration, not by us</text>

  <!-- Signers -->
  <text x="246" y="838" class="t s12">user</text>
  <text x="498" y="838" class="t s12">user</text>
  <text x="750" y="828" class="t s12">user (forwarded into the CPI)</text>
  <text x="750" y="847" class="t s12">+ vault PDA via seeds</text>
  <text x="1002" y="828" class="t s12">user</text>
  <text x="1002" y="847" class="t s12">+ vault PDA via seeds</text>

  <text x="40" y="888" class="m s11">Every instruction re-derives the PDAs from seeds and checks the stored bumps, so a caller can't pass someone else's vault.</text>
</svg>
